[project]
site_name = "molcfg"
site_description = "Configuration library for predictable loading, merging, validation, and source tracking."
site_url = "https://molcrafts.github.io/molcfg/"
site_author = "Roy Kid"
copyright = "Copyright &copy; 2026 MolCrafts"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MolCrafts/molcfg"
repo_name = "MolCrafts/molcfg"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Getting Started" = "getting-started.md" },
    { "Sources" = "sources.md" },
    { "Validation" = "validation.md" },
    { "Merge" = "merge.md" },
    { "Registry" = "registry.md" },
    { "Concurrency" = "concurrency.md" },
  ] },
  { "API Reference" = "api.md" },
  { "Changelog" = "release-notes.md" },
]

# Shared MolCrafts theme (github.com/MolCrafts/molcrafts-zensical-theme): brand
# palette, light/dark schemes, navigation features, and the home-page
# hero/manual-home layout that docs/index.md uses. The theme already supplies
# the features/palette/fonts — do not re-list them here. Install the theme to
# build (see the `docs` optional-dependency group in pyproject.toml).
[project.theme]
name = "molcrafts"
language = "en"

# molcfg accent (teal) for links, hovers, and hero eyebrows.
[project.extra.molcrafts]
product = "molcfg"
accent = "#0f766e"                        # primary (主) — molcfg signature colour
accent_soft = "rgba(15, 118, 110, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molcfg"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/molcrafts-molcfg/"
